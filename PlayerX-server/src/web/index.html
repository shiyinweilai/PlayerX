<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>PlayerX · 评分收集</title>
<link rel="stylesheet" href="/web/style.css" />
</head>
<body>
<!-- ────────── 顶栏 ────────── -->
<header class="topbar">
    <div class="brand">
        <span class="brand-mark">★</span>
        <span class="brand-name">PlayerX</span>
        <span class="brand-sub">评分收集中心</span>
    </div>
    <div class="topbar-right">
        <span class="status-pill" id="serverStatus">
            <span class="dot"></span><span id="serverStatusText">连接中…</span>
        </span>
        <button class="ghost-btn" id="refreshBtn" title="刷新列表">↻</button>
    </div>
</header>

<!-- ────────── 概览卡片 ────────── -->
<section class="cards">
    <div class="card">
        <div class="card-label">已收文件</div>
        <div class="card-value" id="kpiCount">—</div>
        <div class="card-foot">总数</div>
    </div>
    <div class="card">
        <div class="card-label">评分人</div>
        <div class="card-value" id="kpiUsers">—</div>
        <div class="card-foot">独立用户</div>
    </div>
    <div class="card">
        <div class="card-label">标签组</div>
        <div class="card-value" id="kpiTags">—</div>
        <div class="card-foot">user / tag 组合</div>
    </div>
    <div class="card">
        <div class="card-label">总大小</div>
        <div class="card-value" id="kpiSize">—</div>
        <div class="card-foot">uploads/</div>
    </div>
</section>

<!-- ────────── 操作行 ────────── -->
<section class="toolbar">
    <div class="toolbar-left">
        <input type="search" id="searchInput" placeholder="搜索 评分人 / 标签 / 文件名…" />
        <span class="sel-info" id="selInfo" hidden>已选 <b id="selCount">0</b> 项</span>
    </div>
    <div class="toolbar-right">
        <button class="ghost-btn" id="archiveSelBtn" disabled title="把选中的文件归档到指定文件夹">
            📦 归档选中
        </button>
        <button class="ghost-btn danger" id="deleteSelBtn" disabled title="批量删除选中的文件">
            🗑 删除选中
        </button>
        <span class="sep"></span>
        <button class="ghost-btn" id="openArchiveBtn" title="查看归档库">
            📂 归档库
        </button>
        <span class="sep"></span>
        <button class="primary-btn" id="mergeLatestBtn" title="每个 (评分人, 标签) 仅取最新一份">
            ⬇ 合并下载（最新）
        </button>
        <button class="ghost-btn" id="mergeAllBtn" title="合并所有 csv（含历史）">
            ⬇ 合并全部
        </button>
    </div>
</section>

<!-- ────────── 列表表格 ────────── -->
<section class="table-wrap">
    <table id="filesTable">
        <thead>
            <tr>
                <th class="col-check"><input type="checkbox" id="selAll" title="全选/取消" /></th>
                <th class="sortable" data-key="user">评分人</th>
                <th class="sortable" data-key="tag">标签</th>
                <th class="sortable" data-key="name">文件名</th>
                <th class="sortable num" data-key="size">大小</th>
                <th class="sortable num" data-key="mtime">最近更新 ⌄</th>
                <th class="actions">操作</th>
            </tr>
        </thead>
        <tbody id="filesTbody">
            <!-- 动态填充 -->
        </tbody>
    </table>
    <div class="empty" id="emptyHint" hidden>
        <div class="empty-icon">📭</div>
        <div class="empty-title">暂无 CSV</div>
        <div class="empty-sub">客户端导出评分后点击「上传到云端」即可在这里看到。</div>
    </div>
</section>

<footer class="footer">
    <span id="appVer">PlayerX-server</span>
    <span class="dim">·</span>
    <a href="/list" target="_blank">原始 JSON</a>
    <span class="dim">·</span>
    <a href="/merge" target="_blank">合并下载</a>
</footer>

<!-- ────────── Toast ────────── -->
<div class="toast" id="toast" hidden></div>

<!-- ────────── 归档库抽屉（左侧滑出，左右双栏） ────────── -->
<aside class="archive-drawer" id="archiveDrawer" hidden aria-labelledby="archiveTitle" role="complementary">
    <div class="archive-head">
        <span class="archive-title" id="archiveTitle">📂 归档库</span>
        <span class="archive-meta" id="archiveMeta"></span>
        <span class="archive-actions">
            <button class="ghost-btn" id="archiveRefresh" title="刷新归档列表">↻</button>
            <button class="ghost-btn" id="archiveClose"   title="关闭归档库">×</button>
        </span>
    </div>
    <div class="archive-body">
        <!-- 左：文件夹列表 -->
        <aside class="archive-folders" id="archiveFolders">
            <div class="archive-empty" id="archiveFoldersEmpty" hidden>
                还没有归档文件夹。<br/>在主列表勾选文件后点击「归档选中」即可创建。
            </div>
            <ul class="archive-folder-list" id="archiveFolderList"></ul>
        </aside>
        <!-- 右：当前文件夹内容 -->
        <section class="archive-files" id="archiveFiles">
            <div class="archive-files-toolbar" id="archiveFilesToolbar" hidden>
                <span class="sel-info" id="archiveSelInfo" hidden>已选 <b id="archiveSelCount">0</b> 项</span>
                <span class="archive-spacer"></span>
                <button class="ghost-btn danger" id="archiveDelSelBtn" disabled title="批量删除选中">
                    🗑 删除选中
                </button>
                <button class="ghost-btn danger" id="archiveDelFolderBtn" title="删除整个文件夹">
                    ❌ 删除此文件夹
                </button>
            </div>
            <div class="archive-files-hint" id="archiveFilesHint">从左侧选择一个归档文件夹查看内容。</div>
            <div class="archive-files-wrap" id="archiveFilesWrap" hidden>
                <table class="archive-files-table" id="archiveFilesTable">
                    <thead>
                        <tr>
                            <th class="col-check"><input type="checkbox" id="archiveSelAll" title="全选/取消" /></th>
                            <th>文件名</th>
                            <th class="num">大小</th>
                            <th class="num">最近更新</th>
                            <th class="actions">操作</th>
                        </tr>
                    </thead>
                    <tbody id="archiveFilesTbody"></tbody>
                </table>
            </div>
        </section>
    </div>
</aside>

<!-- ────────── 预览抽屉（右侧滑出，无遮罩） ────────── -->
<aside class="preview-drawer" id="previewMask" hidden aria-labelledby="previewTitle" role="complementary">
    <div class="preview-head">
        <span class="preview-title" id="previewTitle">CSV 预览</span>
        <span class="preview-meta" id="previewMeta"></span>
        <span class="preview-actions">
            <button class="ghost-btn" id="previewDownload" title="下载原文件">下载</button>
            <button class="ghost-btn" id="previewClose" title="关闭预览">×</button>
        </span>
    </div>
    <div class="preview-body" id="previewBody">
        <div class="preview-loading">加载中…</div>
    </div>
</aside>

<script src="/web/app.js"></script>
</body>
</html>
